<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Koordinasi UP Sengkang</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] }, 
                    colors: { 
                        pln: { dark: '#1e293b', blue: '#1d4ed8', lightblue: '#eff6ff', yellow: '#fcd34d' }
                    } 
                } 
            } 
        }
    </script>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden font-sans antialiased">

    <!-- Container Utama -->
    <div class="flex w-full h-full relative bg-slate-900">
        
        <!-- BAGIAN KANAN (Background Gambar) -->
        <div class="absolute inset-0 w-full h-full z-0">
            <!-- Menggunakan gambar dummy pembangkit listrik untuk contoh -->
            <img src="https://images.unsplash.com/photo-1513828583688-c52646db42da?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80" alt="Power Plant Background" class="w-full h-full object-cover opacity-90">
            <!-- Overlay Gelap agar teks terbaca -->
            <div class="absolute inset-0 bg-gradient-to-l from-black/60 to-transparent"></div>
            
            <!-- Teks Slogan Kanan Bawah -->
            <div class="absolute bottom-16 right-16 text-right hidden md:block">
                <h2 class="text-white text-3xl lg:text-4xl font-bold leading-tight drop-shadow-xl text-shadow-sm">
                    Kolaborasi<br>
                    Hari Ini<br>
                    untuk Energi<br>
                    Masa Depan
                </h2>
            </div>
        </div>

        <!-- BAGIAN KIRI (Form Login) -->
        <!-- Pengaturan width & kurva (menggunakan rounded-r-[60px] untuk efek lengkung sederhana) -->
        <div class="w-full md:w-[45%] lg:w-[40%] h-full bg-white relative z-10 flex flex-col justify-between shadow-[20px_0_30px_rgba(0,0,0,0.15)] md:rounded-r-[60px] overflow-visible">
            
            <!-- Elemen Kurva SVG Mulus (Opsional untuk Desktop) -->
            <svg class="absolute hidden md:block h-full w-24 -right-23 top-0 text-white translate-x-[99%]" fill="currentColor" viewBox="0 0 100 100" preserveAspectRatio="none">
                <path d="M0,0 Q100,50 0,100 Z" />
            </svg>

            <!-- Wrapper Konten Form -->
            <div class="w-full max-w-sm m-auto px-8 py-10 relative z-20">
                
                <!-- Logo PLN -->
                <div class="flex items-center gap-3 mb-10">
                    <img src="logo-pln.png" alt="Logo PLN" class="w-12 h-12 object-contain  p-1 rounded-sm shadow-sm">
                    <div class="leading-tight">
                        <span class="text-blue-600 font-bold text-lg">PLN</span><br>
                        <span class="text-gray-500 text-xs font-semibold">Nusantara Power</span>
                    </div>
                </div>

                <!-- Judul -->
                <h1 class="text-2xl lg:text-3xl font-bold text-gray-800 leading-snug mb-2">Sistem Koordinasi<br>UP Sengkang</h1>
                <p class="text-gray-500 text-sm mb-8 font-medium">Masuk untuk melanjutkan</p>

                <!-- Form -->
                <form action="index.html" method="GET" class="space-y-5">
                    
                    <!-- Input Email -->
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1.5">Username / Email</label>
                        <input type="email" placeholder="nama@plnnp.co.id" class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm text-gray-700 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" required>
                    </div>

                    <!-- Input Password -->
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1.5">Password</label>
                        <input type="password" placeholder="••••••••" class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm text-gray-700 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" required>
                    </div>

                    <!-- Lupa Password -->
                    <div class="flex justify-end mt-2">
                        <a href="#" class="text-blue-600 hover:text-blue-800 text-xs font-semibold transition">Lupa password?</a>
                    </div>

                    <!-- Tombol Login -->
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-3.5 text-sm font-bold shadow-md hover:shadow-lg transition-all mt-4">
                        Login
                    </button>
                </form>

            </div>

            <!-- Bagian Bawah: Ikon Tata Nilai PLN (AKHLAK/Values) -->
            <div class="w-full px-8 pb-10 pt-4 flex justify-between items-center text-gray-400 relative z-20 border-t border-gray-50 max-w-md mx-auto">
                <div class="flex flex-col items-center gap-2 hover:text-blue-600 transition cursor-default">
                    <i class="fas fa-shield-alt text-lg"></i>
                    <span class="text-[9px] font-bold tracking-wide">Integritas</span>
                </div>
                <div class="flex flex-col items-center gap-2 hover:text-blue-600 transition cursor-default">
                    <i class="fas fa-user-tie text-lg"></i>
                    <span class="text-[9px] font-bold tracking-wide">Profesional</span>
                </div>
                <div class="flex flex-col items-center gap-2 hover:text-blue-600 transition cursor-default">
                    <i class="fas fa-dharmachakra text-lg"></i>
                    <span class="text-[9px] font-bold tracking-wide">Sinergi</span>
                </div>
                <div class="flex flex-col items-center gap-2 hover:text-blue-600 transition cursor-default">
                    <i class="fas fa-hands-helping text-lg"></i>
                    <span class="text-[9px] font-bold tracking-wide">Pelayanan</span>
                </div>
                <div class="flex flex-col items-center gap-2 hover:text-blue-600 transition cursor-default">
                    <i class="fas fa-gem text-lg"></i>
                    <span class="text-[9px] font-bold tracking-wide">Kesempurnaan</span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
